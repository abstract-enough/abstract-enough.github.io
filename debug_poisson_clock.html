<html>
  <head>
    <title>Poisson clock</title>
    <script>
      document.addEventListener("DOMContentLoaded", function(event)
      {

        function simple_hash(extinction_time)
        {
            
            var string_to_hash = extinction_time.toUTCString()
            
            var hash_sum = 0
      
            for (var i = 0; i < string_to_hash.length; i++)
            {
              hash_sum += string_to_hash.charCodeAt(i)
            }
            
            //40 species extinct a day
            var extinction_rate = 40/(24*60*60)

            var simulation_resolution = 100

            var hash_value = hash_sum % simulation_resolution

            var exponential_distribution_sample = -1*Math.log(hash_value/simulation_resolution)/extinction_rate // natural log

            var poisson_delta_t = exponential_distribution_sample

            return poisson_delta_t
            
        }
        
        function every_second()
        {

          var current_time = new Date()

          //first extinction event
          var extinction_time = new Date(new Date().getFullYear(), 0, 1);

          while (extinction_time < current_time)
          {
            var delta_t_seconds = simple_hash(extinction_time)
            var extinction_time = new Date(extinction_time.getTime() + 1000*delta_t_seconds)
          }
          
          var next_extinction_string = extinction_time.toString()
          document.getElementById("poisson_clock").innerHTML="<p>Time of next extinction:<br>"+next_extinction_string+"</p>"
        }
        var myInterval = setInterval(every_second, 1000)
      
      })
    </script>
  </head>
  <body>
    <p id="poisson_clock"></p>
    <br>
    <br>
    <p>Next extinction time simulated using a Poisson random process with a rate of 40 extinctions per day. </p>
  </body>
</html>
