        function simulation_helper(extinction_time)
        {
          var current_time = new Date()
          if (extinction_time < current_time)
          {    
            var delta_t_seconds = 60*60*24 //simple_hash(extinction_time)
            var extinction_time = new Date(extinction_time + 1000*delta_t_seconds)
            return simulation_helper(extinction_time)
          }
          else
          {
            return extinction_time
          }
        }
        
        function every_second()
        {
          
            var simulation_first_extinction_time = new Date(new Date().getFullYear(), 0, 1);
            var next_extinction_time=simulation_helper(simulation_first_extinction_time)

            //var temp_date = new Date()
            var next_extinction_string = next_extinction_time.toString()
            document.getElementById("poisson_clock").innerHTML="<p>"+simulation_first_extinction_time+"</p><br><p>Time of next extinction:<br>"+next_extinction_string+"</p>"
        }
        var myInterval = setInterval(every_second, 1000)
