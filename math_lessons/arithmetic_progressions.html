<html>
  <head>
    <title>arithmetic progressions practice</title>
    <script>
      document.addEventListener("DOMContentLoaded", function(event)
      {

        function repeat_lesson(sum, integer)
        {
          new_sum = sum + integer

          document.getElementById("headline").innerHTML = new_sum.toString()

          setTimeout(function(){

            repeat_lesson(new_sum, integer)
            
          }, 10000);

          
        }

        integer = rand
        repeat_lesson(integer, integer)
        var myInterval = setInterval(repeat_lesson, 15000)
      
      })
    </script>
  </head>
  <body>
    <p id="headline" style="font-size: 50px;"></p>
  </body>
</html>
