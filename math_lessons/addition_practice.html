<html>
  <head>
    <title>addition practice</title>
    <script>
      document.addEventListener("DOMContentLoaded", function(event)
      {

        function every_second()
        {
          min = 1
          max = 10
          range = max - min
          
          int_A = Math.floor(Math.random() * range) + 1;
          int_B = Math.floor(Math.random() * range) + 1;

          document.getElementById("headline").innerHTML = int_A.toString() + " + " + int_B.toString()

          setTimeout(function(){

            int_C = int_A + int_B
            document.getElementById("headline").innerHTML = int_C.toString()
            
          }, 10000);

          
        }
        var myInterval = setInterval(every_second, 20000)
      
      })
    </script>
  </head>
  <body>
    <p id="headline"></p>
  </body>
</html>
