    <title>definition of catalan number</title>
  </head>
  <body>
    <p>A common definition of the nth catalan number is "the number of non overlapping partitions of a graph of circularly arranged vertices". If we restrict ourselve to partitions of "subsets contained by convex boundaries", this is the meaning of the nth catalan number.</p>
  </body>
