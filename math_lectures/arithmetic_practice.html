<html>
  <head>
    <title>addition practice</title>
    <script>
      document.addEventListener("DOMContentLoaded", function(event)
      {
// 1. Select the button and the output area using their IDs
const myButton = document.getElementById("myButton");

// 2. Define the function you want to run when the button is clicked
function handleClick() {
  myButton.textContent = "new"
}

// 3. Attach the event listener to the button
myButton.addEventListener("click", handleClick);

        function repeat_lesson()
        {
          min = 1
          max = 10
          range = max - min
          
          int_A = Math.floor(Math.random() * range) + min;
          int_B = Math.floor(Math.random() * range) + min;

          document.getElementById("headline").innerHTML = int_A.toString() + " + " + int_B.toString()

          setTimeout(function(){

            int_C = int_A + int_B
            document.getElementById("headline").innerHTML = int_C.toString()
            
          }, 10000);

          
        }
        repeat_lesson()
        var myInterval = setInterval(repeat_lesson, 15000)
      
      })
    </script>
  </head>
  <body>
    <p id="headline" style="font-size: 50px;"></p>
    <button id="math_button">
  </body>
</html>
