<html>
  <head>
    <title>arithmetic practice</title>
    <script>
      document.addEventListener("DOMContentLoaded", function(event)
      {

        const add_button = document.getElementById("add_button");
        const subtract_button = document.getElementById("subtract_button");
        const multiply_button = document.getElementById("multiply_button");
        const divide_button = document.getElementById("divide_button");

        add_button.addEventListener("click", handle_add_click);
        subtract_button.addEventListener("click", handle_subtract_click);
        multiply_button.addEventListener("click", handle_multiply_click);
        divide_button.addEventListener("click", handle_divide_click);
        
      })

     var int_C=0
     var flag="problem"

     function practice_loop(operator, min_number, max_number)
     {
                 
          if (flag == "problem")
          {
            range = max_number - min_number
          
            if (operator == "add")
            {
              int_A = Math.floor(Math.random() * range) + min;
              int_B = Math.floor(Math.random() * range) + min;
              problem_button.textContent = int_A.toString() + " + " + int_B.toString()
              int_C = int_A + int_B
            }

            if (operator == "subtract")
            {
              int_A = Math.floor(Math.random() * range) + min;
              int_B = Math.floor(Math.random() * range) + min;
              problem_button.textContent = int_A.toString() + " - " + int_B.toString()
              int_C = int_A - int_B
            }

            if (operator == "multiply")
            {
              int_A = Math.floor(Math.random() * range) + min;
              int_B = Math.floor(Math.random() * range) + min;
              problem_button.textContent = int_A.toString() + " x " + int_B.toString()
              int_C = int_A + int_B
            }

            if (operator == "divide")
            {
              int_C = Math.floor(Math.random() * range) + min;
              int_A = Math.floor(Math.random() * range) + min;
              int_B = int_A * int_C
              problem_button.textContent = int_A.toString() + " / " + int_B.toString()
              
            }
            
            flag = "answer"
          }
          else
          {
            problem_button.textContent = int_C
            flag = "problem"
          }
      }
     }
      
     function handle_add_click()
     {        
       const min_input = document.getElementById("min_input");
       const max_input = document.getElementById("max_input");
       const min_number = min_input.value;
       const max_number = max_input.value;
       const intro_screen = document.getElementById("intro_screen");
       intro_screen.innerHTML = "<button id="problem_button"></button>";
       const problem_button = document.getElementById("problem_button");
       problem_button.addEventListener("click", practice_loop);
       practice_loop("add", min_number, max_number);
     }
     function handle_subtract_click()
     {
       const min_input = document.getElementById("min_input");
       const max_input = document.getElementById("max_input");
       const min_number = min_input.value;
       const max_number = max_input.value;
       const intro_screen = document.getElementById("intro_screen");
       intro_screen.innerHTML = "<button id="problem_button"></button>";
       const problem_button = document.getElementById("problem_button");
       problem_button.addEventListener("click", practice_loop);
       practice_loop("subtract", min_number, max_number);
     }
     function handle_multiply_click()
     {
       const min_input = document.getElementById("min_input");
       const max_input = document.getElementById("max_input");
       const min_number = min_input.value;
       const max_number = max_input.value;
       const intro_screen = document.getElementById("intro_screen");
       intro_screen.innerHTML = "<button id="problem_button"></button>";
       const problem_button = document.getElementById("problem_button");
       problem_button.addEventListener("click", practice_loop);
       practice_loop("multiply", min_number, max_number);
     }
     function handle_divide_click()
     {
       const min_input = document.getElementById("min_input");
       const max_input = document.getElementById("max_input");
       const min_number = min_input.value;
       const max_number = max_input.value;
       const intro_screen = document.getElementById("intro_screen");
       intro_screen.innerHTML = "<button id="problem_button"></button>";
       const problem_button = document.getElementById("problem_button");
       problem_button.addEventListener("click", practice_loop);
       practice_loop("divide", min_number, max_number);
     }

    
    </script>

    </style>

  <body>
    <section id="intro_screen">
      <button id="add_button">add</button>
      <button id="subtract_button">subtract</button>
      <button id="multiply_button">multiply</button>
      <button id="divide_button">divide</button>
      <br>
      <p>Min <input id="min_input" type="number" value="1" width="50px;"> Max <input id="max_input" type="number" value="10" width="50px;"></p>
